name: Update README Stats Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:

jobs:
  update-cards:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v6

      - name: Generate personal GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: true
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_border=true&custom_title=GitHub%20Stats

      - name: Generate combined top languages
        run: |
          npm install --no-save --ignore-scripts tsx @stats-organization/github-readme-stats-core@2.1.3
          npx tsx scripts/generate-top-langs.mts \
            "${{ secrets.GH_STATS_TOKEN }}" \
            "${{ github.repository_owner }}" \
            "profile/top-langs.svg"
        env:
          EXCLUDE_REPOS: ${{ secrets.GH_STATS_EXCLUDE_REPOS }}
          INCLUDE_ORG_REPOS: ${{ secrets.GH_STATS_TARGET_REPOS }}

      - name: Generate selected repository contributions
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          path: profile/selected-work.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: true
          options: username=${{ github.repository_owner }}&repo=${{ secrets.GH_STATS_TARGET_REPOS }}&include_all_commits=true&hide=prs,issues,stars,contribs&show=prs_authored,prs_commented,prs_reviewed,issues_authored,issues_commented&hide_rank=true&hide_border=true&custom_title=Selected%20Repository%20Contributions

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats cards" || exit 0
          git push
